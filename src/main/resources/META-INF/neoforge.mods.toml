license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="xulai"
logoFile="logo.png"
logoBlur=false
description='''
Three equipment presets per player (main hand + offhand + helmet/chestplate/leggings/boots).
Open the preset GUI with the button on the left side of the inventory screen,
or swap the whole loadout instantly in combat by holding the selector key (default R)
and pressing 1/2/3. Items always go back to their own preset slot, so loadouts never mix.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

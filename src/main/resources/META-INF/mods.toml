modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''
Three equipment presets per player (main hand + offhand + helmet/chestplate/leggings/boots).
Open the preset GUI with the button in the top-right corner of the inventory screen,
or swap the whole loadout instantly in combat by holding the selector key (default R)
and pressing 1/2/3. Items always go back to their own preset slot, so loadouts never mix.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

pluginManagement {
    repositories {
        // 阿里云：梯子关闭时的国内首选（梯子开启时会被屏蔽，快速失败后走下面的源）
        maven { url = 'https://maven.aliyun.com/repository/public' }
        // Maven Central 官方源：梯子开启时走代理可达
        mavenCentral()
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        // BMCLAPI / lss233：NeoForge 与 Minecraft 相关构件（lss233 证书已过期，仅兜底）
        maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
        maven { url = 'https://lss233.littleservice.cn/repository/minecraft' }
        // 官方源兜底（直连被墙，需梯子）
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'gearswap'
